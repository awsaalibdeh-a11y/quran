<script>(function () {
  var s = document.getElementById("splash"); if (!s) return;
  try { var st = JSON.parse(localStorage.getItem("noor.settings") || "{}"); if (st.splash === false || sessionStorage.getItem("noorSplash")) { s.remove(); return; } sessionStorage.setItem("noorSplash", "1"); } catch (e) { }
  setTimeout(function () { if (s.parentNode) s.remove(); }, 5700);
})();</script>
